[project]
name = "iqraa-skill-tools"
version = "0.1.0"
description = "Iqraa Law skill CI and release staging."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
skill-ci = "skill_tools.ci:main"
skill-stage = "skill_tools.stage:main"
corpus-ci = "skill_tools.corpus_ci:main"

[build-system]
# Pinned: uv.lock does not lock the build backend, and `uv sync` builds this project with it (O-57). The version
# `uv sync` resolved on 2026-11-07, tested then by the skills gate; raise it on purpose, with a rebuild and that gate.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
