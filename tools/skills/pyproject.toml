[project]
name = "iqraa-skill-tools"
version = "0.1.0"
description = "Iqraa Law skill CI and release staging."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
skill-ci = "skill_tools.ci:main"
skill-stage = "skill_tools.stage:main"
corpus-ci = "skill_tools.corpus_ci:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
