[project]
name = "legal-search"
version = "0.1.0"
description = "Iqraa Law legal-search MCP service: Jordanian statute retrieval with Arabic full-text search, caps and a retrieval log."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.20,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn>=0.30",
  "tzdata>=2024.1",
  "starlette>=1.0,<2",
  "anyio>=4.5,<5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
legal-search = "legal_search.server:main"
legal-search-ingest = "legal_search.ingest:main"
legal-search-eval = "legal_search.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
