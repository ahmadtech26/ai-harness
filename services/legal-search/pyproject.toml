[project]
name = "legal-search"
version = "0.1.0"
description = "Iqraa Law legal-search MCP service: Jordanian statute retrieval with Arabic full-text search, caps and a retrieval log."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.20,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn>=0.30,<1",
  "tzdata>=2024.1",
  "starlette>=1.0,<2",
  "anyio>=4.5,<5",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
legal-search = "legal_search.server:main"
legal-search-ingest = "legal_search.ingest:main"
legal-search-eval = "legal_search.evaluate:main"

# uv's own backend (R2 n=35): uv builds with the copy bundled in its executable while it satisfies this range, so
# no build backend is fetched from PyPI and run at image build. The module is src/legal_search (its default).
[build-system]
requires = ["uv_build>=0.9.30,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
