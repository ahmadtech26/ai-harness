# Staging reverse proxy in front of LibreChat (G-security T7).
# LibreChat sends its own enforcing nonce policy for scripts (CSP_ENABLED). That policy always allows
# https: images and connections, so the proxy adds a second policy; browsers enforce both, and the
# narrower one closes data exfiltration through remote images, fetches and frames. It names only
# the directives it narrows: no default-src, which would also apply to scripts and styles and block
# LibreChat's nonce'd inline scripts and inline styles.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Arabic by default: a visitor without a language cookie gets lang=ar (LibreChat reads this cookie
# first; a user's own choice in settings replaces it). An empty value sends no header.
map $cookie_lang $iqraa_default_lang {
  ''      'lang=ar; Path=/; Max-Age=31536000; SameSite=Lax';
  default '';
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 25m;

  add_header Content-Security-Policy "img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Set-Cookie $iqraa_default_lang always;

  location / {
    proxy_pass http://librechat:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never forward a client-chosen tenant: tenancy is decided here, per host, once firms exist.
    proxy_set_header X-Tenant-Id "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Server-sent events (chat streams) must reach the browser unbuffered.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
  }
}
