# Staging LibreChat configuration for the Iqraa fork. ${...} values are generated into the secrets volume.
# Interface flags here apply to the built-in USER and ADMIN roles only; customers sit in plan roles
# (content/roles.json: every permission explicit, only AGENTS.USE and MCP_SERVERS.USE on), so creation stays
# enabled for staff. The flags below also hide the matching screens for everyone, and the fork's default-deny
# API allowlist (customer-api.ts) is what actually closes the routes.
version: 1.3.17
cache: true

interface:
  customWelcome: 'اقرأ للمحاماة — بيئة الاختبار'
  # Chat only: no model picker beside the tiers, parameters, presets, prompt library, bookmarks, memory,
  # schedules, multi-chat, temporary chat, sharing, code or web search (REQ-CHAT-001).
  modelSelect: false
  parameters: false
  presets: false
  bookmarks: false
  multiConvo: false
  memories: false
  temporaryChat: false
  runCode: false
  webSearch: false
  fileSearch: false
  fileCitations: false
  schedules: false
  prompts: false
  sharedLinks: false
  agents:
    use: true
    create: true
    share: true
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false
  # Customers must keep USE: LibreChat drops an agent's MCP tools for a role without it (ToolService), which
  # would take the library away from the specialist. The fork's allowlist denies /api/mcp/* to customers.
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false

# The tiers: generated by `node content/tiers.mjs apply` from content/tiers.json and the released agents.
# enforce stays false on purpose: it would bind staff too, and the fork's tier gate already requires a tier
# for every customer chat turn.
# BEGIN iqraa:modelSpecs (generated by content/tiers.mjs apply; do not edit by hand)
modelSpecs:
  enforce: false
  prioritize: true
  list: []
# END iqraa:modelSpecs

balance:
  enabled: false

transactions:
  enabled: true

mcpSettings:
  allowedDomains:
    - 'http://legal-search:8000'
  allowedAddresses:
    - 'legal-search:8000'

mcpServers:
  legal-search:
    type: streamable-http
    url: http://legal-search:8000/mcp
    requiresOAuth: false
    headers:
      X-Iqraa-Secret: '${LEGAL_SEARCH_SECRET}'
    requestHeaders:
      X-Iqraa-User: '{{LIBRECHAT_USER_ID}}'
      X-Iqraa-Message: '{{LIBRECHAT_BODY_MESSAGEID}}'
      X-Iqraa-Conversation: '{{LIBRECHAT_BODY_CONVERSATIONID}}'

endpoints:
  agents:
    # Required by the fork (hook L3): titles after the turn, so a turn metering refused gets none.
    titleTiming: final
    # Closed corpus: no execute_code, web_search or file_search (the fork refuses to start with them).
    disableBuilder: true
    capabilities:
      - skills
      - tools
      - context
  custom:
    - name: 'MockLLM'
      apiKey: '${MOCK_LLM_API_KEY}'
      baseURL: 'http://mock-llm:8080/v1'
      models:
        default:
          - 'mock-model'
        fetch: false
      titleConvo: true
      titleModel: 'mock-model'
      modelDisplayLabel: 'Mock LLM'

# Attachments are context only (REQ-CHAT: documents the customer brings, never a search index): three files of
# up to 5 MB each, 10 MB together, PDF, Word and plain text. Sizes are in MB.
fileConfig:
  serverFileSizeLimit: 5
  avatarSizeLimit: 1
  endpoints:
    agents:
      fileLimit: 3
      fileSizeLimit: 5
      totalSizeLimit: 10
      supportedMimeTypes:
        - '^application/pdf$'
        - '^application/vnd\.openxmlformats-officedocument\.wordprocessingml\.document$'
        - '^text/plain$'
    # The upload route looks the limits up by the `endpoint` field of the form, which the client chooses: the
    # same limits under `default` hold for any other value.
    default:
      fileLimit: 3
      fileSizeLimit: 5
      totalSizeLimit: 10
      supportedMimeTypes:
        - '^application/pdf$'
        - '^application/vnd\.openxmlformats-officedocument\.wordprocessingml\.document$'
        - '^text/plain$'
    # LibreChat's built-in file config keeps its own entries for these three endpoints (`anthropic` allows 10
    # files, the assistants endpoints their own types) and `default` does not override them: the same limits, spelled out.
    anthropic:
      fileLimit: 3
      fileSizeLimit: 5
      totalSizeLimit: 10
      supportedMimeTypes:
        - '^application/pdf$'
        - '^application/vnd\.openxmlformats-officedocument\.wordprocessingml\.document$'
        - '^text/plain$'
    assistants:
      fileLimit: 3
      fileSizeLimit: 5
      totalSizeLimit: 10
      supportedMimeTypes:
        - '^application/pdf$'
        - '^application/vnd\.openxmlformats-officedocument\.wordprocessingml\.document$'
        - '^text/plain$'
    azureAssistants:
      fileLimit: 3
      fileSizeLimit: 5
      totalSizeLimit: 10
      supportedMimeTypes:
        - '^application/pdf$'
        - '^application/vnd\.openxmlformats-officedocument\.wordprocessingml\.document$'
        - '^text/plain$'
