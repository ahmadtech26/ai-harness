# Staging LibreChat configuration for the Iqraa fork. ${...} values are generated into the secrets volume.
# Interface flags here apply to the built-in USER and ADMIN roles only; customers sit in plan roles
# (content/roles.json), so creation stays enabled for staff.
version: 1.3.17
cache: true

interface:
  customWelcome: 'اقرأ للمحاماة — بيئة الاختبار'
  agents:
    use: true
    create: true
    share: true
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: true
  multiConvo: false
  memories: false
  runCode: false
  webSearch: false
  fileSearch: true

balance:
  enabled: false

transactions:
  enabled: true

mcpSettings:
  allowedDomains:
    - 'http://legal-search:8000'
  allowedAddresses:
    - 'legal-search:8000'

mcpServers:
  legal-search:
    type: streamable-http
    url: http://legal-search:8000/mcp
    requiresOAuth: false
    headers:
      X-Iqraa-Secret: '${LEGAL_SEARCH_SECRET}'
    requestHeaders:
      X-Iqraa-User: '{{LIBRECHAT_USER_ID}}'
      X-Iqraa-Message: '{{LIBRECHAT_BODY_MESSAGEID}}'
      X-Iqraa-Conversation: '{{LIBRECHAT_BODY_CONVERSATIONID}}'

endpoints:
  agents:
    capabilities:
      - skills
      - tools
      - context
      - chain
  custom:
    - name: 'MockLLM'
      apiKey: '${MOCK_LLM_API_KEY}'
      baseURL: 'http://mock-llm:8080/v1'
      models:
        default:
          - 'mock-model'
        fetch: false
      titleConvo: true
      titleModel: 'mock-model'
      modelDisplayLabel: 'Mock LLM'
