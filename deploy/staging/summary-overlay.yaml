
# Scenario 3 only (see compose.summary.yaml): summarise early, with prompts the mock recognises.
# The agents library summarises only messages pruned out of the context window, so no trigger fires
# until a conversation overflows it; scenario 3 gives the specialist a small window
# (S3_MAX_CONTEXT_TOKENS, default 9000) for that reason.
summarization:
  enabled: true
  provider: MockLLM
  model: mock-model
  prompt: 'IQRAA_SUMMARY_PROMPT: summarize the conversation so far in a few sentences.'
  updatePrompt: 'IQRAA_SUMMARY_PROMPT: update the summary with the new messages.'
  trigger:
    type: messages_to_refine
    value: 4
  retainRecent:
    turns: 1
